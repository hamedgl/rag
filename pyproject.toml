[project]
name = "rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "langchain>=1.4.4",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.0",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langfuse>=4.17.0",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.19.1",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "torchvision>=0.29.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "langchain-chroma>=1.1.0",
]
