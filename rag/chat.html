<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LangChain Docs Chat</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root { --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --card: #fff; --line: #e7e5e4; --accent: #0f766e; --code: #f5f5f4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1917; --fg: #e7e5e4; --muted: #a8a29e; --card: #292524; --line: #44403c; --accent: #5eead4; --code: #1c1917; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 140px; }
  h1 { font-size: 17px; margin: 8px 0 20px; }
  .msg { margin: 14px 0; padding: 12px 14px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); }
  .user { background: transparent; border-style: dashed; }
  .text { overflow-wrap: anywhere; }
  .user .text { white-space: pre-wrap; }
  .text > :first-child { margin-top: 0; } .text > :last-child { margin-bottom: 0; }
  .text p, .text ul, .text ol, .text pre, .text table, .text blockquote { margin: 0 0 10px; }
  .text ul, .text ol { padding-left: 22px; } .text li { margin: 3px 0; }
  .text h1, .text h2, .text h3, .text h4 { font-size: 15px; margin: 14px 0 6px; }
  .text strong { font-weight: 650; }
  .text code { font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  .text pre { background: var(--code); border: 1px solid var(--line); padding: 10px 12px; border-radius: 6px; overflow-x: auto; }
  .text pre code { border: 0; padding: 0; background: none; }
  .text table { border-collapse: collapse; display: block; overflow-x: auto; }
  .text th, .text td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
  .text blockquote { border-left: 3px solid var(--line); padding-left: 10px; color: var(--muted); }
  .cite { font-size: 12px; text-decoration: none; padding: 0 4px; border-radius: 4px; background: var(--code); border: 1px solid var(--line); white-space: nowrap; }
  a { color: var(--accent); }
  .meta, .sources { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .sources ol { margin: 4px 0 0; padding-left: 20px; }
  .fb { margin-top: 8px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .fb button { font-size: 15px; padding: 2px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
  .fb input { flex: 1; min-width: 160px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  .error { color: #dc2626; }
  form { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); border-top: 1px solid var(--line); padding: 12px 16px; }
  form div { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; }
  textarea { flex: 1; resize: none; height: 58px; padding: 8px 10px; font: inherit; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); }
  form button { padding: 0 18px; border: 0; border-radius: 8px; background: var(--accent); color: var(--bg); font-weight: 600; cursor: pointer; }
  form button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<main>
  <h1>LangChain docs chat <span class="meta">· answers only from the LangChain, LangGraph &amp; Deep Agents open-source docs (not LangSmith), with sources</span></h1>
  <div id="log"></div>
</main>
<form id="form">
  <div>
    <textarea id="q" placeholder="Ask about LangChain, LangGraph or Deep Agents… (Enter to send, Shift+Enter for newline)" aria-label="Question"></textarea>
    <button id="send">Send</button>
  </div>
</form>
<script>
const log = document.getElementById("log"), q = document.getElementById("q"), send = document.getElementById("send");
const messages = [];   // full conversation, sent with every request (the server is stateless per chat)

const esc = s => s.replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

// LLM output is untrusted (it read third-party docs): markdown -> HTML, then DOMPurify strips scripts, handlers, iframes.
// Citations [source] or 【source】 (gpt-oss style) become small links to the doc page.
// Output policy, enforced here and not trusted to the model (prompt rules alone failed the injection tests, M6):
// no images (an <img> loads on render: a zero-click leak of whatever the model put in its URL), and links only to the docs.
const ALLOWED_LINK = /^https:\/\/docs\.langchain\.com\//;
if (window.DOMPurify) DOMPurify.addHook("afterSanitizeAttributes", n => {
  if (n.tagName === "A") {
    if (ALLOWED_LINK.test(n.getAttribute("href") || "")) { n.target = "_blank"; n.rel = "noopener"; }
    else n.removeAttribute("href");   // keep the text, drop the link
  }
});
function render(text, sources) {
  const urls = Object.fromEntries((sources || []).map(s => [s.source, s.url]));
  const cited = text.replace(/(?:\[|【)([\w./-]+)(?:\]|】)(?!\()/g,
    (m, src) => urls[src] ? `<a class="cite" href="${urls[src]}">${src.split("/").pop()}</a>` : m);
  if (!window.marked || !window.DOMPurify) return esc(text).replace(/\n/g, "<br>");   // CDN unreachable: plain, safe text
  return DOMPurify.sanitize(marked.parse(cited), {FORBID_TAGS: ["img", "picture", "source", "video", "audio", "iframe", "form"]});
}

function bubble(cls) {
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.innerHTML = '<div class="text"></div>';
  log.appendChild(el);
  return el;
}

function feedbackBar(el, id) {
  const bar = document.createElement("div");
  bar.className = "fb";
  bar.innerHTML = '<button title="Good answer">👍</button><button title="Bad answer">👎</button><input placeholder="What was wrong? (optional, sent with 👎)">';
  const [up, down, note] = bar.children;
  const rate = async rating => {
    up.disabled = down.disabled = true;
    const r = await fetch("/feedback", {method: "POST", headers: {"Content-Type": "application/json"},
                                        body: JSON.stringify({id, rating, comment: note.value})});
    bar.innerHTML = r.ok ? '<span class="meta">Thanks, saved.</span>' : '<span class="error">Feedback failed.</span>';
  };
  up.onclick = () => rate(1);
  down.onclick = () => rate(-1);
  el.appendChild(bar);
}

async function ask(text) {
  messages.push({role: "user", content: text});
  bubble("user").firstChild.textContent = text;
  const el = bubble("bot"), out = el.firstChild;
  out.textContent = "Searching…";
  let answer = "", sources = [];
  send.disabled = true;
  try {
    const r = await fetch("/chat", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({messages})});
    if (!r.ok) throw new Error(await r.text());
    const reader = r.body.pipeThrough(new TextDecoderStream()).getReader();
    let buf = "";
    for (;;) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += value;
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {   // one SSE event per blank-line-terminated block
        const block = buf.slice(0, i); buf = buf.slice(i + 2);
        const event = block.match(/^event: (.*)$/m)[1], data = JSON.parse(block.match(/^data: (.*)$/m)[1]);
        if (event === "sources") { sources = data; out.textContent = ""; }
        else if (event === "token") { answer += data; out.innerHTML = render(answer, sources); }
        else if (event === "error") { out.innerHTML += `<div class="error">Error: ${esc(data.message)}</div>`; }
        else if (event === "done") {
          messages.push({role: "assistant", content: answer});
          const t = data.timings;
          // list only sources the answer cites ([src] or 【src】); none cited (e.g. "Not in docs.") -> no list
          const cited = sources.filter(s => new RegExp(`[\\[【]${s.source.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}[\\]】]`).test(answer));
          el.insertAdjacentHTML("beforeend",
            (cited.length ? `<div class="sources">Sources:<ol>${cited.map(s => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.section)}</a></li>`).join("")}</ol></div>` : "") +
            `<div class="meta">${data.query !== text ? `searched as: “${esc(data.query)}” · ` : ""}${esc(data.model)} · first token ${t.first_token ?? "-"}s · total ${t.total}s</div>`);
          feedbackBar(el, data.id);
        }
      }
    }
  } catch (e) {
    out.innerHTML = `<span class="error">Request failed: ${esc(String(e.message || e))}</span>`;
    messages.pop();   // let the user retry without a dangling question
  }
  send.disabled = false;
  q.focus();
}

document.getElementById("form").onsubmit = e => {
  e.preventDefault();
  const text = q.value.trim();
  if (text && !send.disabled) { q.value = ""; ask(text); }
};
q.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("form").requestSubmit(); } };
</script>
</body>
</html>
