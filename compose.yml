services:
  qdrant:
    image: qdrant/qdrant:v1.19.1   # match qdrant-client
    ports: ["127.0.0.1:6333:6333"]  # local only: single user, no auth
    volumes: ["./data/qdrant-server:/qdrant/storage"]
    restart: unless-stopped

  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      LLM_BASE_URL: http://host.docker.internal:20128/v1   # LLM proxy runs on the host
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./data:/app/data                                    # corpus (read at startup) + turns/feedback logs
      - ~/.cache/huggingface:/root/.cache/huggingface:ro   # embedder weights (1.5 GB), not baked into the image
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    depends_on: [qdrant]
    restart: unless-stopped
